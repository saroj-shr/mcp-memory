services:
  # ── Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    networks:
      - kb-internal

  # ── MCP + REST Server ──
  mcp-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kb-mcp-server
    restart: unless-stopped
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - MCP_API_KEY=${MCP_API_KEY}
      - REST_API_KEY=${REST_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - SQLITE_DB_PATH=/app/data/memory.db
      - HF_TOKEN=${HF_TOKEN:-}
    depends_on:
      - qdrant
    networks:
      - kb-internal
    volumes:
      - model_cache:/app/models
      - sqlite_data:/app/data

  # ── Next.js Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kb-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - mcp-server
    networks:
      - kb-internal

  # ── Caddy Reverse Proxy ──
  caddy:
    image: caddy:2-alpine
    container_name: kb-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - mcp-server
    networks:
      - kb-internal

networks:
  kb-internal:
    driver: bridge

volumes:
  qdrant_data:
  model_cache:
  sqlite_data:
  caddy_data:
  caddy_config:
